[package]
authors = [
    "Steffen Butzer <steffen.butzer@outlook.com>",
    "Julius de Bruijn <bruijn@prisma.io>",
    "Eric Sheppard <eric@eigenmo.de>",
    "Yoshua Wuyts <yoshuawuyts@gmail.com>",
]
description = "A TDS (MSSQL) driver"
documentation = "https://docs.rs/tiberius/"
edition = "2021"
rust-version = "1.88"
keywords = ["tds", "mssql", "sql"]
license = "MIT/Apache-2.0"
name = "tiberius"
readme = "README.md"
repository = "https://github.com/prisma/tiberius"
version = "0.13.0"

[workspace]
members = ["runtimes-macro", "tiberius-macros"]

[[test]]
path = "tests/query.rs"
name = "query"

[[test]]
path = "tests/command.rs"
name = "command"

[[test]]
path = "tests/named-instance-tokio.rs"
name = "named-instance-tokio"
required-features = ["sql-browser-tokio"]

[[test]]
path = "tests/named-instance-smol.rs"
name = "named-instance-smol"
required-features = ["sql-browser-smol"]

[[test]]
path = "tests/serde.rs"
name = "serde"
required-features = ["serde"]

[[example]]
name = "named-pipes"
path = "examples/named-pipes.rs"

[dependencies]
enumflags2 = "0.7"
byteorder = "1.0"
encoding_rs = "0.8"
once_cell = "1.3"
thiserror = "2"
bytes = "1.0"
pretty-hex = "0.4"
pin-project-lite = "0.2"
asynchronous-codec = "0.7"
async-trait = "0.1"
connection-string = "0.2"
num-traits = "0.2"
uuid = "1.0"
zeroize = "1.8.2"
secrecy = "0.10"

[target.'cfg(windows)'.dependencies]
winauth = { version = "0.0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.11", optional = true, default-features = false }
sspi = { version = "0.18", optional = true }
libc = "0.2"

[dependencies.async-native-tls]
version = "0.6"
optional = true

[dependencies.tokio]
version = "1.0"
optional = true
features = ["net", "time"]

[dependencies.tokio-util]
version = "0.7"
features = ["compat"]
optional = true

[dependencies.chrono]
version = "0.4"
optional = true
default-features = false

[dependencies.time]
version = "0.3"
optional = true

[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["io", "sink"]

# Runtime-agnostic timer used to bound the connection handshake (see
# `Config::handshake_timeout`). Its `Delay` future works under any executor, so
# the generic, runtime-agnostic `Connection::connect` path can enforce a timeout
# without depending on tokio/smol timers.
[dependencies.futures-timer]
version = "3"

[dependencies.tracing]
features = ["log"]
version = "0.1"

[dependencies.rust_decimal]
version = "1.6"
optional = true

[dependencies.bigdecimal_]
version = "0.4"
optional = true
package = "bigdecimal"

[dependencies.serde]
version = "1.0"
optional = true
features = ["derive", "rc"]

[dependencies.async-io]
version = "2"
optional = true

[dependencies.async-net]
version = "2"
optional = true

[dependencies.futures-lite]
version = "2"
optional = true

[dependencies.tokio-rustls]
version = "0.26.4"
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

# Version-floor pin for RUSTSEC-2026-0104 (rustls-webpki < 0.103.13); pulled in via tokio-rustls.
[dependencies.rustls-webpki]
version = "0.103.13"
optional = true
default-features = false

# Shared certificate DER/PEM types used by the backend-agnostic CA loader
# (`src/client/tls_stream/certs.rs`). Enabled by every TLS backend so all three
# parse trust anchors through one code path. This is the same `rustls-pki-types`
# crate `tokio-rustls` re-exports, so the `CertificateDer` handed to rustls is
# the exact same type.
[dependencies.rustls-pki-types]
version = "1"
optional = true

# Compiled-in Mozilla root CA bundle for the `rustls-webpki-roots` feature.
# Pinned to its current major (1.x). Note: this is a *pinned snapshot* that goes
# stale unless the dependency is updated.
[dependencies.webpki-roots]
version = "1"
optional = true

[dependencies.opentls]
version = "0.2.1"
optional = true
features = ["io-async-std", "vendored"]

[dev-dependencies.uuid]
version = "1.0"
features = ["v4"]

[dev-dependencies.tokio-util]
version = "0.7"
features = ["compat"]

[dev-dependencies.tokio]
features = [
    "macros",
    "sync",
    "io-std",
    "time",
    "io-util",
    "net",
    "rt-multi-thread",
]
version = "1.0"

[dev-dependencies.smol]
version = "2"

[dev-dependencies.runtimes-macro]
path = "./runtimes-macro"

[dependencies.tiberius-macros]
path = "./tiberius-macros"
version = "0.1.0"

[dev-dependencies]
names = "0.14"
anyhow = "1"
env_logger = "0.11"
azure_identity = "1.0"
azure_core = "1"
url = "2.5"
reqwest = "0.13"
paste = "1.0"
indicatif = "0.18"
chrono = "0.4.38"
indoc = "2"
serde_json = "1.0"

[package.metadata.docs.rs]
features = ["all"]
# docs.rs builds on nightly with this cfg set, enabling #[doc(cfg(...))]
# annotations (feature(doc_cfg)) without requiring nightly for normal builds.
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
all = [
    "chrono",
    "time",
    "tds73",
    "tds80",
    "sql-browser-tokio",
    "sql-browser-smol",
    "integrated-auth-gssapi",
    "rust_decimal",
    "bigdecimal",
    "native-tls",
    "serde",
    "sspi-rs",
]
default = ["tds80", "winauth", "native-tls"]
tds73 = []
# Enables TDS 8.0 support, including the `Strict` encryption level (TLS before
# the TDS prelogin, TDS 8.0 "strict" mode). Requires a TLS backend.
tds80 = ["tds73"]
sql-browser-tokio = ["tokio", "tokio-util"]
sql-browser-smol = ["async-io", "async-net", "futures-lite"]
integrated-auth-gssapi = ["libgssapi"]
bigdecimal = ["bigdecimal_"]
rustls = ["tokio-rustls", "tokio-util", "rustls-native-certs", "rustls-webpki", "rustls-pki-types"]
# Bundle a compiled-in snapshot of Mozilla's root CA store, selectable via
# `Config::trust_webpki_roots()` (rustls only). Implies `rustls`; the bundled
# roots are a pinned snapshot that goes stale without dependency updates.
rustls-webpki-roots = ["rustls", "dep:webpki-roots"]
native-tls = ["async-native-tls", "rustls-pki-types"]
vendored-openssl = ["opentls", "rustls-pki-types"]
# Enables Windows-style SSPI/NTLM authentication (`AuthMethod::Windows`) on Unix
# platforms without requiring Kerberos, via the pure-Rust `sspi` crate. On
# Windows the same authentication is provided by the `winauth` feature.
sspi-rs = ["sspi"]
# Optional serde Serialize/Deserialize impls for query result types
# (Row, Column, ColumnData, Numeric, ColumnType and time/xml types).
serde = ["dep:serde", "uuid/serde"]
